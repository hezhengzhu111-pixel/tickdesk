[package]
name = "tickdesk-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bytes = "1"
hyper = "1"
hyper-util = "0.1"
jsonschema = { version = "0.61.2", default-features = false }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.16", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "io-util"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1"
rcgen = "0.14.10"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5", features = ["util"] }

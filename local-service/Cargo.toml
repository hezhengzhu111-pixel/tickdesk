[package]
name = "tickdesk-local"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[features]
# Opt-in test binary only. Normal builds cannot bypass the trading-session gate.
integration-fixtures = []

[dependencies]
anyhow = "1"
base64 = "0.22"
jsonschema = { version = "0.33", default-features = false }
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
num-bigint = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.29"
x509-parser = "0.18"
axum = "0.8"
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rcgen = "0.14"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
